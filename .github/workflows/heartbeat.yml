name: Pipeline heartbeat

# Free pipeline heartbeat. No AI and no paid APIs.
# Reads run history for every workflow with the job token (actions: read)
# and writes health.json only to the health-data branch.
# Read-only toward every other workflow and branch. Never pushes main,
# desk-data, races-data, or ua-f1-data.

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/heartbeat.yml"
      - "scripts/heartbeat.py"
      - "scripts/tests/test_heartbeat.py"
      - "scripts/tests/health-strip.spec.mjs"
      - "scripts/tests/playwright.config.mjs"
      - "revamp/**"
      - "index.html"
      - "races/tests/test_race.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-heartbeat-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Heartbeat unit tests
        run: python3 -m unittest discover -s scripts/tests -p test_heartbeat.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          set -euo pipefail
          npm init -y
          npm install --no-package-lock @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Health strip screenshots
        run: npx playwright test --config scripts/tests/playwright.config.mjs
      - name: Upload health strip screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-strip
          path: output/health-strip-*.png
          if-no-files-found: error

  publish:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false

      - name: Read run history and write health.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          test -n "${GITHUB_TOKEN}"
          python3 "$GITHUB_WORKSPACE/code/scripts/heartbeat.py" \
            --publish-branch health-data \
            --workflows-dir "$GITHUB_WORKSPACE/code/.github/workflows" \
            --out "$RUNNER_TEMP/health.json"

      - name: Prepare health-data
        working-directory: code
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin health-data >/dev/null 2>&1; then
            git fetch --depth 1 origin health-data
            git worktree add "$GITHUB_WORKSPACE/data" FETCH_HEAD
          else
            mkdir -p "$GITHUB_WORKSPACE/data"
            git -C "$GITHUB_WORKSPACE/data" init -b health-data
          fi
          cp "$RUNNER_TEMP/health.json" "$GITHUB_WORKSPACE/data/health.json"
          python3 "$GITHUB_WORKSPACE/code/scripts/heartbeat.py" --check "$GITHUB_WORKSPACE/data/health.json"

      - name: Privacy guard on health.json
        working-directory: data
        env:
          PRIVACY_GUARD_PATTERNS: ${{ secrets.PRIVACY_GUARD_PATTERNS }}
          PRIVACY_IDENTITY_HASHES: ${{ secrets.PRIVACY_IDENTITY_HASHES }}
          SIGHTLINE_PRIVATE_TOKEN: ${{ secrets.SIGHTLINE_PRIVATE_TOKEN }}
          RUGGER_ID_PEPPER: ${{ secrets.RUGGER_ID_PEPPER }}
        run: bash "$GITHUB_WORKSPACE/code/scripts/privacy-guard.sh" --root "$GITHUB_WORKSPACE/data" health.json

      - name: Commit health.json to health-data only
        working-directory: data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          target=health-data
          case "$target" in
            main|master|desk-data|races-data|ua-f1-data)
              echo "refusing $target"
              exit 1
              ;;
          esac
          if [ "$target" != "health-data" ]; then
            echo "refusing $target"
            exit 1
          fi
          git config user.name "sightline-heartbeat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "pipeline heartbeat $(date -u +%Y-%m-%dT%H:%MZ)"
          if [ ! -d .git ] && [ ! -f .git ]; then
            echo "health-data checkout is missing"
            exit 1
          fi
          if ! git remote get-url origin >/dev/null 2>&1; then
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:health-data
