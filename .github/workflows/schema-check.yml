name: schema-check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "jsonschema>=4.18"
      - name: Validate desk files listed in desks.json
        run: python scripts/validate-desks.py
      - name: Solada prefilter tests
        run: python3 -m unittest discover -s solada-prefilter/tests
      - name: Solana desk tests
        run: python3 -m unittest discover -s solana-desk/tests -t solana-desk
