name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy guard
        env:
          PRIVACY_GUARD_PATTERNS: ${{ secrets.PRIVACY_GUARD_PATTERNS }}
          RUGGER_ID_PEPPER: ${{ secrets.RUGGER_ID_PEPPER }}
        run: bash scripts/privacy-guard.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate desk files
        run: |
          pip install --quiet "jsonschema>=4.18"
          python3 scripts/validate-desks.py
      - name: Dashboard smoke checks
        run: node scripts/smoke-dashboard.mjs
      - name: Fill missing icons (best effort)
        continue-on-error: true
        run: |
          pip install --quiet pillow
          timeout 120 python3 tools/resolve-icons.py . || true
      - name: Build static site
        run: python3 scripts/build-site.py
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
