name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Rebuild after a successful data run on main. No new cron.
  # workflow_run matches the workflow name. run-solada.yml only pings the
  # webhook; the Cardano file itself is written by Solada prefilter.
  workflow_run:
    workflows: ["solana-desk-scan.yml", "run-solada.yml", "nft-snapshot.yml", "Solada prefilter"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages run at a time. cancel-in-progress stays false so a deploy is not
# killed mid-flight. A burst of upstream completions waits in this group.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pull requests and manual runs still build. A workflow_run deploys only
    # after a successful upstream run on main, in this repository.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy guard
        env:
          PRIVACY_GUARD_PATTERNS: ${{ secrets.PRIVACY_GUARD_PATTERNS }}
          PRIVACY_IDENTITY_HASHES: ${{ secrets.PRIVACY_IDENTITY_HASHES }}
          SIGHTLINE_PRIVATE_TOKEN: ${{ secrets.SIGHTLINE_PRIVATE_TOKEN }}
          RUGGER_ID_PEPPER: ${{ secrets.RUGGER_ID_PEPPER }}
        run: bash scripts/privacy-guard.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate desk files
        run: |
          pip install --quiet "jsonschema>=4.18"
          python3 scripts/validate-desks.py
      - name: Dashboard smoke checks
        run: node scripts/smoke-dashboard.mjs
      - name: Radar smoke checks
        run: node scripts/smoke-radar.mjs
      - name: Fill missing icons (best effort)
        continue-on-error: true
        run: |
          pip install --quiet pillow
          timeout 120 python3 tools/resolve-icons.py . || true
      - name: Brief publisher tests
        run: |
          python3 scripts/tests/test_publish_briefs.py
          python3 scripts/tests/test_fx_prices.py
          python3 scripts/tests/test_score_picks.py
      - name: Build static site
        env:
          SIGHTLINE_REQUIRE_FEEDS: "1"
        run: python3 scripts/build-site.py
      - name: Privacy guard on the radar snapshot
        env:
          PRIVACY_GUARD_PATTERNS: ${{ secrets.PRIVACY_GUARD_PATTERNS }}
          PRIVACY_IDENTITY_HASHES: ${{ secrets.PRIVACY_IDENTITY_HASHES }}
          SIGHTLINE_PRIVATE_TOKEN: ${{ secrets.SIGHTLINE_PRIVATE_TOKEN }}
          RUGGER_ID_PEPPER: ${{ secrets.RUGGER_ID_PEPPER }}
        run: |
          if [ -f dist/radar.json ]; then
            bash scripts/privacy-guard.sh dist/radar.json
          else
            echo "radar.json was not built; the page shows an empty snapshot"
          fi
      - name: Upload Pages artifact
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
