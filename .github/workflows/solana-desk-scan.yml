name: Solana desk scan

# Paper-only Solana desk scanner + paper fill step (plan v6.5). No AI, no wallets, no real orders.
# Runs every 30 min in auto mode (paper fills once config is frozen and FILL_READY); commits generated files ONLY to the
# desk-data branch with pull --rebase retries and no force-push.

on:
  schedule:
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [solana-desk-scan]   # external fallback trigger (cron-job.org)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (default: fill once frozen and the fill step is on main), scan, or fill"
        required: false
        default: auto

permissions:
  contents: write

concurrency:
  group: solana-desk-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    # Issue writes are only for the data-health alert. Actions cannot scope a token to one step.
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out main (code)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code
      - name: Check out desk-data (generated files)
        uses: actions/checkout@v4
        with:
          ref: desk-data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore private rugger list (Actions cache, never committed)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/solana-desk-cache
          key: solana-desk-rugger-${{ github.run_id }}
          restore-keys: solana-desk-rugger-
      - name: Run scanner
        id: scan
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SOLANA_DESK_CACHE_DIR: ${{ runner.temp }}/solana-desk-cache
          PRIVACY_GUARD_PATTERNS: ${{ secrets.PRIVACY_GUARD_PATTERNS }}
          RUGGER_ID_PEPPER: ${{ secrets.RUGGER_ID_PEPPER }}
          RUGGER_ACCEPT_RESET: ${{ vars.RUGGER_ACCEPT_RESET }}
          # Logging-only v2 records. Set the repo variable to 0 to skip them. Default on.
          SOLANA_DESK_V2_LOG: ${{ vars.SOLANA_DESK_V2_LOG || '1' }}
          # Mode: manual input > repo variable SOLANA_DESK_MODE (set to 'scan' to pause fills without a PR) > auto
          MODE: ${{ github.event.inputs.mode || vars.SOLANA_DESK_MODE || 'auto' }}
        working-directory: code/solana-desk
        run: |
          if [ -z "$JUPITER_API_KEY" ]; then echo "::warning::JUPITER_API_KEY secret not set; using keyless Jupiter (noted in health.json)"; fi
          mkdir -p "$SOLANA_DESK_CACHE_DIR"
          timeout 420 python3 -m desk.run --mode "$MODE" --data-dir "$GITHUB_WORKSPACE/data/solana-desk" --cache-dir "$SOLANA_DESK_CACHE_DIR"
      - name: Commit to desk-data
        if: always()
        env:
          PRIVACY_GUARD_PATTERNS: ${{ secrets.PRIVACY_GUARD_PATTERNS }}
          PRIVACY_IDENTITY_HASHES: ${{ secrets.PRIVACY_IDENTITY_HASHES }}
          SIGHTLINE_PRIVATE_TOKEN: ${{ secrets.SIGHTLINE_PRIVATE_TOKEN }}
          RUGGER_ID_PEPPER: ${{ secrets.RUGGER_ID_PEPPER }}
        working-directory: data
        run: |
          git config user.name "solana-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # v6.5 ledger first. v2/ is a second commit so a log-file guard miss cannot drop the scan.
          git add -A solana-desk
          git reset -q -- solana-desk/v2 || true
          if ! git diff --cached --quiet; then
            if ! bash "$GITHUB_WORKSPACE/code/scripts/privacy-guard.sh" --root "$GITHUB_WORKSPACE/data"; then
              echo "::error::privacy guard failed on desk-data changes; not committing or pushing"
              git reset -q
              exit 1
            fi
            git commit -q -m "desk scan $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for i in 1 2 3 4 5; do
              git push origin HEAD:desk-data && { pushed=1; break; }
              echo "push conflict, retry $i"; sleep $((i * 5))
              git pull --rebase origin desk-data || { git rebase --abort; exit 1; }
            done
            [ "$pushed" = 1 ] || exit 1
          else
            echo "nothing to commit for the v6.5 files"
          fi
          git add -A solana-desk/v2
          if git diff --cached --quiet; then
            echo "no v2 log to commit"
            exit 0
          fi
          if ! bash "$GITHUB_WORKSPACE/code/scripts/privacy-guard.sh" --root "$GITHUB_WORKSPACE/data"; then
            echo "::warning::privacy guard failed on v2 logs; the v6.5 scan commit is already pushed"
            git reset -q
            exit 0
          fi
          git commit -q -m "desk scan v2 log $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:desk-data && exit 0
            echo "v2 push conflict, retry $i"; sleep $((i * 5))
            git pull --rebase origin desk-data || { git rebase --abort; echo "::warning::v2 log push did not finish"; exit 0; }
          done
          echo "::warning::v2 log push did not finish"
          exit 0
      - name: Sync private rugger list
        if: always()
        timeout-minutes: 2
        env:
          SIGHTLINE_PRIVATE_TOKEN: ${{ secrets.SIGHTLINE_PRIVATE_TOKEN }}
          RUGGER_ACCEPT_RESET: ${{ vars.RUGGER_ACCEPT_RESET }}
        working-directory: code
        run: |
          python3 -m rugger_blacklist.sync --desk solana \
            --cache-dir "${{ runner.temp }}/solana-desk-cache" \
            --public-dir "$GITHUB_WORKSPACE/data/solana-desk"
      - name: Save private rugger list
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/solana-desk-cache
          key: solana-desk-rugger-${{ github.run_id }}
      - name: Data health alert
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$GITHUB_WORKSPACE/code/scripts/data_health_alert.py" \
            --data-dir "$GITHUB_WORKSPACE/data/solana-desk" \
            || echo "::warning::data health alert did not finish"
