name: Evidence packet

# Manual evidence pilot. Read-only.
# workflow_dispatch only: no schedule, no push, no repository_dispatch.
# GitHub will not list this file for dispatch until it is on the default branch.
# Do not merge this branch just to make the button appear.
# Permissions are contents read and actions read. The job checks out desk-data
# and uploads an artifact. It does not commit, push, scan, trade, or alert.
# upload-artifact authenticates with its own internal token. If a post-merge
# run cannot upload, that is an acceptance failure to fix after approval.
# It is not a reason to merge early or to widen contents to write.

on:
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: "Optional earlier evidence-packet run id. Empty means a first run; deltas stay unknown."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: evidence-packet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this ref (builder)
        uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false

      - name: Check out desk-data (read only)
        uses: actions/checkout@v4
        with:
          ref: desk-data
          path: data
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packet test dependency
        working-directory: code
        run: python3 -m pip install --quiet -r scripts/evidence/requirements.txt

      - name: Evidence packet tests
        working-directory: code
        run: python3 -m unittest discover -s scripts/tests -p test_evidence_packet.py

      - name: Actions snapshot
        working-directory: code
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/evidence/fetch_actions.py --repo "$REPO" --out "$RUNNER_TEMP/actions-snapshot.json"

      - name: Previous packet
        if: inputs.previous_run_id != ''
        env:
          PREV: ${{ inputs.previous_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PREV" in
            ''|*[!0-9]*) echo "previous_run_id must be digits"; exit 2 ;;
          esac
          # The job workspace is not a checkout. code/ and data/ are subdirectories,
          # so gh cannot infer the repository unless it is passed.
          gh run download "$PREV" --repo "$GITHUB_REPOSITORY" --name evidence-packet --dir "$RUNNER_TEMP/previous"

      - name: Build packet and retain replay inputs
        env:
          REPO: ${{ github.repository }}
          PREV: ${{ inputs.previous_run_id }}
        run: |
          set -euo pipefail
          # Captured after the checkouts and the snapshot fetch, not typed in advance.
          AS_OF=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CODE_COMMIT=$(git -C "$GITHUB_WORKSPACE/code" rev-parse HEAD)
          DATA_COMMIT=$(git -C "$GITHUB_WORKSPACE/data" rev-parse HEAD)
          # No previous_run_id: this is a first run. Deltas stay unknown.
          extra=()
          if [ -n "$PREV" ]; then
            extra+=(--previous "$RUNNER_TEMP/previous/evidence-packet.json")
          fi
          python3 "$GITHUB_WORKSPACE/code/scripts/evidence/packet.py" \
            --repo "$GITHUB_WORKSPACE/code" \
            --data "$GITHUB_WORKSPACE/data" \
            --as-of "$AS_OF" \
            --actions-snapshot "$RUNNER_TEMP/actions-snapshot.json" \
            --repo-slug "$REPO" \
            --code-commit "$CODE_COMMIT" \
            --data-commit "$DATA_COMMIT" \
            --retain-replay \
            --out "$GITHUB_WORKSPACE/packet" \
            "${extra[@]}"

      - name: Privacy guard on every uploaded file
        working-directory: code
        env:
          PRIVACY_GUARD_PATTERNS: ${{ secrets.PRIVACY_GUARD_PATTERNS }}
          PRIVACY_IDENTITY_HASHES: ${{ secrets.PRIVACY_IDENTITY_HASHES }}
          SIGHTLINE_PRIVATE_TOKEN: ${{ secrets.SIGHTLINE_PRIVATE_TOKEN }}
          RUGGER_ID_PEPPER: ${{ secrets.RUGGER_ID_PEPPER }}
        run: |
          mapfile -t files < <(find "$GITHUB_WORKSPACE/packet" -type f | sort)
          [ "${#files[@]}" -gt 0 ]
          python3 scripts/evidence/packet.py --check-upload "$GITHUB_WORKSPACE/packet" --repo "$GITHUB_WORKSPACE/code"
          bash scripts/privacy-guard.sh "${files[@]}"

      - name: Upload packet
        uses: actions/upload-artifact@v4
        with:
          name: evidence-packet
          path: packet
          if-no-files-found: error
          retention-days: 7
