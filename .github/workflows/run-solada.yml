name: Run Solada

# Uses the same secrets as the Solada pre-filter: SOLADA_WEBHOOK_URL and
# SOLADA_WEBHOOK_KEY (key only, no 'Bearer' prefix).

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Solada to run
        env:
          URL: ${{ secrets.SOLADA_WEBHOOK_URL }}
          KEY: ${{ secrets.SOLADA_WEBHOOK_KEY }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${URL}" ] || [ -z "${KEY}" ]; then
            echo "SOLADA_WEBHOOK_URL or SOLADA_WEBHOOK_KEY is not set. No request was sent."
            exit 1
          fi
          body=$(jq -n --arg actor "$ACTOR" '{source:"sightline-run-solada",requested_by:$actor}')
          curl -fsS -o /dev/null -w "webhook: HTTP %{http_code}\n" -X POST "$URL" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -d "$body"
          echo "Solada run requested."
