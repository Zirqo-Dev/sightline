name: Run Solada

# If the routine panel's Authorization header field includes the 'Authorization:' prefix,
# paste only the part after the colon into *_RUN_WEBHOOK_AUTH.

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Solada to run
        env:
          URL: ${{ secrets.SOLADA_RUN_WEBHOOK_URL }}
          AUTH: ${{ secrets.SOLADA_RUN_WEBHOOK_AUTH }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${URL}" ] || [ -z "${AUTH}" ]; then
            echo "SOLADA_RUN_WEBHOOK_URL or SOLADA_RUN_WEBHOOK_AUTH is not set. No request was sent."
            exit 0
          fi
          body=$(jq -n --arg actor "$ACTOR" '{source:"sightline-run-solada",requested_by:$actor}')
          curl -fsS -X POST "$URL" -H "Authorization: $AUTH" -H 'Content-Type: application/json' -d "$body"
          echo "Solada run requested."
