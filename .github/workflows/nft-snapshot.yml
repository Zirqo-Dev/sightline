name: NFT snapshot

# Snapshot-only NH-04 pilot. touches no Solana file or rule; adds one workflow in a shared repo.
# The Solana 30-minute loop uses concurrency group solana-desk-scan and pushes to desk-data.
# This job uses its own group and pushes only to nft-data, so a failure here cannot fail or delay that loop.
# Summary rows only: no raw OpenSea bodies, per-order prices or raw order hashes. USD from Chainlink only. No Actions artifacts. No key is minted here.
# The first run creates nft-data. Later runs push to it. publish_nft_data.sh auths with the job token.

# Trigger of record: the owner's cron-job.org job dispatches this workflow hourly at :27.
# v0.3 removes the GitHub schedule so two runs cannot land in the same hour.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN: snapshot into a temp dir, write only the step summary, never publish"
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - "nft/loop/**"
      - "schema/nft-snapshot.schema.json"
      - ".github/workflows/nft-snapshot.yml"
      - "scripts/privacy-guard.sh"

permissions:
  contents: read

concurrency:
  group: nft-snapshot
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: NH-04 pilot tests
        run: |
          pip install --quiet "jsonschema>=4.18"
          python3 -m unittest discover -s nft/loop/tests -v

  snapshot:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # "true" only on a manual DRY_RUN dispatch. cron-job.org sends only ref, so this is "false".
      NFT_DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: code
          persist-credentials: false
      - name: Look up nft-data
        id: nft_branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          body=$(mktemp)
          # The REST API takes Bearer. Git push does not; the publish script sends Basic.
          if ! code=$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/nft-data"); then
            rm -f "$body"
            echo "nft-data lookup failed" >&2
            exit 1
          fi
          rm -f "$body"
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "nft-data lookup failed: HTTP ${code}" >&2
            exit 1
          fi
      - name: Check out nft-data
        if: steps.nft_branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: nft-data
          path: data
          fetch-depth: 1
          persist-credentials: false
      - name: Start nft-data if this is the first run
        if: steps.nft_branch.outputs.exists != 'true'
        run: |
          rm -rf data
          mkdir -p data
          git -C data init -b nft-data
          git -C data remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot
        if: inputs.dry_run != true
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: python3 code/nft/loop/snapshot.py --data-dir "$GITHUB_WORKSPACE/data" --code-sha "${{ github.sha }}"
      - name: Dry run (temp dir, step summary only)
        if: inputs.dry_run == true
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: python3 code/nft/loop/snapshot.py --dry-run --data-dir "$(mktemp -d)" --code-sha "${{ github.sha }}"
      - name: Privacy guard on nft-data
        if: success() && inputs.dry_run != true
        env:
          PRIVACY_GUARD_PATTERNS: ${{ secrets.PRIVACY_GUARD_PATTERNS }}
          PRIVACY_IDENTITY_HASHES: ${{ secrets.PRIVACY_IDENTITY_HASHES }}
          SIGHTLINE_PRIVATE_TOKEN: ${{ secrets.SIGHTLINE_PRIVATE_TOKEN }}
          RUGGER_ID_PEPPER: ${{ secrets.RUGGER_ID_PEPPER }}
        working-directory: data
        run: |
          git add -A nft-pilot
          if git diff --cached --quiet; then
            echo "no nft-data changes"
            exit 0
          fi
          bash "$GITHUB_WORKSPACE/code/scripts/privacy-guard.sh" --root "$GITHUB_WORKSPACE/data"
      - name: Commit to nft-data
        if: success() && inputs.dry_run != true
        working-directory: data
        env:
          TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/code/nft/loop/publish_nft_data.sh"
