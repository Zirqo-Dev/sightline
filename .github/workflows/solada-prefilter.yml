name: Solada prefilter

# Zero-AI numeric pre-filter for the Solada desk (solada-prefilter/prefilter.py).
# Only trigger: cron-job.org -> workflow_dispatch (job "Solada pre-filter", every 2h at :07).
# No GitHub schedule: its delayed, off-slot runs (e.g. Oct 25 8:26 PM, Oct 26 3:52 AM and 11:15 AM ET)
# doubled up on the dispatch runs and sent extra webhooks.
# Reads rules from main; writes state/results ONLY to desk-data:solada-prefilter/
# with pull --rebase retries and no force-push. Never touches main data files.
# Flag-only cabal/whale signals go to desk-data:solada-prefilter/flags.json; their
# private working data (full stake keys, sniper positions) rides in the same Actions
# cache as the whale snapshot (flags-cache.json) and is never committed.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = evaluate but never POST the webhook"
        required: false
        default: "false"
      ping:
        description: "true = skip the scan and only POST a test payload to the webhook"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: solada-prefilter
  cancel-in-progress: false

jobs:
  prefilter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main (code + rules)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code
      - name: Webhook ping (no scan, no state)
        if: github.event.inputs.ping == 'true'
        env:
          SOLADA_WEBHOOK_URL: ${{ secrets.SOLADA_WEBHOOK_URL }}
          SOLADA_WEBHOOK_KEY: ${{ secrets.SOLADA_WEBHOOK_KEY }}
        working-directory: code
        run: python3 solada-prefilter/prefilter.py --ping --data-dir /tmp/unused
      - name: Check out desk-data (state + results)
        if: github.event.inputs.ping != 'true'
        uses: actions/checkout@v4
        with:
          ref: desk-data
          path: data
      - uses: actions/setup-python@v5
        if: github.event.inputs.ping != 'true'
        with:
          python-version: "3.12"
      - name: Offline flag tests (no network, no secrets)
        if: github.event.inputs.ping != 'true'
        working-directory: code
        run: python3 -m unittest discover -s solada-prefilter/tests
      - name: Restore private whale snapshot (Actions cache, never committed)
        if: github.event.inputs.ping != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/prefilter-cache
          key: solada-prefilter-whale-${{ github.run_id }}
          restore-keys: solada-prefilter-whale-
      - name: Run prefilter
        if: github.event.inputs.ping != 'true'
        env:
          BLOCKFROST_PROJECT_ID: ${{ secrets.BLOCKFROST_PROJECT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLADA_WEBHOOK_URL: ${{ secrets.SOLADA_WEBHOOK_URL }}
          SOLADA_WEBHOOK_KEY: ${{ secrets.SOLADA_WEBHOOK_KEY }}
          PREFILTER_CACHE_DIR: ${{ runner.temp }}/prefilter-cache
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        working-directory: code
        run: |
          [ -z "$BLOCKFROST_PROJECT_ID" ] && echo "::warning::BLOCKFROST_PROJECT_ID not set; using Koios"
          [ -z "$SOLADA_WEBHOOK_URL" ] && echo "::warning::SOLADA_WEBHOOK_URL not set; triggers are logged, not sent"
          flag=""; [ "$DRY_RUN" = "true" ] && flag="--dry-run"
          timeout 780 python3 solada-prefilter/prefilter.py --repo . --data-dir "$GITHUB_WORKSPACE/data/solada-prefilter" --desk-data "$GITHUB_WORKSPACE/data" $flag
      - name: Save private whale snapshot
        if: always() && github.event.inputs.ping != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/prefilter-cache
          key: solada-prefilter-whale-${{ github.run_id }}
      - name: Commit to desk-data
        if: always() && github.event.inputs.ping != 'true'
        env:
          PRIVACY_GUARD_PATTERNS: ${{ secrets.PRIVACY_GUARD_PATTERNS }}
        working-directory: data
        run: |
          git config user.name "solada-prefilter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d solada-prefilter ] || { echo "no output"; exit 0; }
          git add -A solada-prefilter
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          # Privacy guard on the staged desk-data files before commit/push (run-forensics.yml pattern).
          # A failure aborts the push; nothing is committed or pushed.
          if ! bash "$GITHUB_WORKSPACE/code/scripts/privacy-guard.sh" --root "$GITHUB_WORKSPACE/data"; then
            echo "::error::privacy guard failed on desk-data changes; not committing or pushing"
            git reset -q
            exit 1
          fi
          git commit -q -m "solada prefilter $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:desk-data && exit 0
            echo "push conflict, retry $i"; sleep $((i * 5))
            git pull --rebase origin desk-data || { git rebase --abort; exit 1; }
          done
          exit 1
