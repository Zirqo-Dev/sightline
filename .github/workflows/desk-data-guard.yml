name: desk-data-guard

# Backstop: run main's privacy guard and schema validation against the
# desk-data branch. Read-only; never writes to desk-data.
# The guard scans every tracked file, including solada-prefilter/dev_checks.json,
# solada-prefilter/liquidity_moves.json, solada-prefilter/vetoes.json and
# solana-desk/rugger_would_veto.json, with the same patterns and allowlist. A dev_tag,
# actor_tag, or veto evidence tag there must be a role label or a w- hash. Rugger ids
# are r- HMAC ids. A raw wallet key or a private rugger-blacklist file fails the guard.
# The allowlist does not mask those files.
# Pushes made with the built-in GITHUB_TOKEN (desk scan, solada-prefilter)
# do not trigger workflows, so a timed run covers those. Primary: cron-job.org ->
# workflow_dispatch hourly. The GitHub schedule stays as a backup only: this job is
# read-only and idempotent (an extra run just re-checks), and GitHub's schedule has been
# firing hours apart for this repo.

on:
  push:
    branches: [desk-data]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desk-data-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (scripts and schemas)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          persist-credentials: false
      - name: Check out desk-data
        uses: actions/checkout@v4
        with:
          ref: desk-data
          path: desk-data
          persist-credentials: false
      - name: Privacy guard on desk-data
        env:
          PRIVACY_GUARD_PATTERNS: ${{ secrets.PRIVACY_GUARD_PATTERNS }}
          RUGGER_ID_PEPPER: ${{ secrets.RUGGER_ID_PEPPER }}
        run: bash main/scripts/privacy-guard.sh --root desk-data
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
      - name: Schema validation on desk-data
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet "jsonschema>=4.18"
          python3 main/scripts/validate-desks.py "$GITHUB_WORKSPACE/desk-data"
